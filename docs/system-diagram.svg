<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b4226"/>
    </marker>
  </defs>

  <rect width="960" height="430" fill="#ffffff"/>

  <text x="40" y="42" font-size="20" font-weight="700" fill="#3a2414">eShelf Cloud: system diagram</text>
  <text x="40" y="66" font-size="14" fill="#6b5a4a">The browser only talks to Render. Only Render talks to the database.</text>

  <!-- GitHub -->
  <rect x="370" y="92" width="220" height="56" rx="10" fill="#ffffff" stroke="#8b6b4e" stroke-width="1.5"/>
  <text x="480" y="117" font-size="15" font-weight="700" fill="#3a2414" text-anchor="middle">GitHub (public repo)</text>
  <text x="480" y="137" font-size="12" fill="#6b5a4a" text-anchor="middle">eshelf-cloud source code</text>
  <line x1="480" y1="148" x2="480" y2="196" stroke="#6b4226" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="492" y="177" font-size="12" fill="#6b5a4a">git push to main triggers an automatic build</text>

  <!-- Browser -->
  <rect x="30" y="215" width="220" height="120" rx="10" fill="#ffffff" stroke="#8b6b4e" stroke-width="1.5"/>
  <text x="48" y="243" font-size="15" font-weight="700" fill="#3a2414">Browser (client)</text>
  <text x="48" y="266" font-size="12" fill="#3a3a3a">Bookshelf page:</text>
  <text x="48" y="284" font-size="12" fill="#3a3a3a">"Add a book" form + book list</text>
  <text x="48" y="302" font-size="12" fill="#3a3a3a">fetch() calls to /api/books</text>
  <text x="48" y="320" font-size="12" fill="#6b5a4a">(Postman uses the same API)</text>

  <!-- Render -->
  <rect x="350" y="200" width="260" height="150" rx="10" fill="#f3e6d6" stroke="#6b4226" stroke-width="2"/>
  <text x="368" y="228" font-size="15" font-weight="700" fill="#3a2414">Render (PaaS) Web Service</text>
  <text x="368" y="251" font-size="12" fill="#3a3a3a">Node.js + Express app</text>
  <text x="368" y="269" font-size="12" fill="#3a3a3a">Serves public/ (HTML, CSS, JS)</text>
  <text x="368" y="287" font-size="12" fill="#3a3a3a">GET /api/books, GET /api/books/:id</text>
  <text x="368" y="305" font-size="12" fill="#3a3a3a">POST /api/books (validates input)</text>
  <text x="368" y="328" font-size="12" fill="#6b5a4a">Secret env var: DATABASE_URL</text>

  <!-- Aiven -->
  <rect x="710" y="215" width="220" height="120" rx="10" fill="#f3e6d6" stroke="#6b4226" stroke-width="2"/>
  <text x="728" y="243" font-size="15" font-weight="700" fill="#3a2414">Aiven (managed DB)</text>
  <text x="728" y="266" font-size="12" fill="#3a3a3a">PostgreSQL</text>
  <text x="728" y="284" font-size="12" fill="#3a3a3a">books table</text>
  <text x="728" y="302" font-size="12" fill="#6b5a4a">Aiven runs patches</text>
  <text x="728" y="320" font-size="12" fill="#6b5a4a">and backups</text>

  <!-- Browser <-> Render -->
  <line x1="252" y1="275" x2="348" y2="275" stroke="#6b4226" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="300" y="263" font-size="12" fill="#3a3a3a" text-anchor="middle">GET / POST</text>
  <text x="300" y="295" font-size="12" fill="#6b5a4a" text-anchor="middle">HTTPS, JSON</text>

  <!-- Render <-> Aiven -->
  <line x1="612" y1="275" x2="708" y2="275" stroke="#6b4226" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="660" y="263" font-size="12" fill="#3a3a3a" text-anchor="middle">SQL queries</text>
  <text x="660" y="295" font-size="12" fill="#6b5a4a" text-anchor="middle">over SSL</text>

  <!-- Legend -->
  <rect x="40" y="385" width="18" height="14" rx="3" fill="#f3e6d6" stroke="#6b4226" stroke-width="1.5"/>
  <text x="66" y="397" font-size="12" fill="#3a3a3a">Shaded = the provider runs the OS, runtime, HTTPS and database engine. You own the code, data and secrets.</text>
</svg>
